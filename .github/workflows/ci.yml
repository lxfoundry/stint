name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# An explicit bash runs with pipefail, so a failed download fails its step.
defaults:
  run:
    shell: bash

# The pinned toolchain, which the set-up action (.github/actions/setup) installs in every job.
env:
  RUST_VERSION: "1.99.1"
  AGAVE_VERSION: "4.3.2"
  ANCHOR_VERSION: "1.2.1"
  SURFPOOL_VERSION: "1.6.1"
  KORA_VERSION: "2.0.5"

# `build` builds the program once and runs the quicker checks; the two end-to-end jobs then run side by side on that
# build of the program.
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    # A run with a cold cache installs Anchor and Kora from source first, and saves the cache only when the job succeeds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the program
        run: anchor build --ignore-keys

      - name: Keep the program for the end-to-end jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program
          path: target/deploy/stint.so
          if-no-files-found: error
          retention-days: 1

      - name: Program tests
        run: cargo test -p stint

      - name: Check the generated client is current
        run: |
          pnpm generate:client
          git diff --exit-code -- packages/program-client
          test -z "$(git status --porcelain -- packages/program-client)"

      - name: Check the generated Subscriptions client is current
        run: |
          pnpm --filter @lxfoundry/stint-subscriptions-client run generate
          git diff --exit-code -- packages/subscriptions-client
          test -z "$(git status --porcelain -- packages/subscriptions-client)"

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

  e2e-tests:
    name: End-to-end package tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: The program built by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: program
          path: target/deploy

      - name: End-to-end package tests
        run: pnpm test:e2e

  e2e-scenarios:
    name: End-to-end scenarios, local target
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: The program built by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: program
          path: target/deploy

      - name: End-to-end, local target
        run: pnpm e2e:local

      - name: Report
        if: always()
        run: |
          if [ -f e2e/report/report.md ]; then cat e2e/report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/report
          if-no-files-found: ignore
